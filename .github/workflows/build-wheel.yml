name: Build Python Wheel

on:
  push:
    branches: [ mainline, neil/34-calico-pybind212 ]
  pull_request:
    branches: [ mainline ]
  workflow_dispatch:

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          export DOCKER_BUILDKIT=1
          export UBUNTU_VERSION=22.04
          docker build --progress plain --pull -f Dockerfile \
            -t ghcr.io/yangjames/calico:latest \
            --build-arg UBUNTU_VERSION .

      - name: Build Python wheel
        run: |
          docker run --rm \
            -v $(pwd):/calico:rw \
            ghcr.io/yangjames/calico:latest \
            /bin/bash -c "python3 -m build --wheel && auditwheel repair --plat manylinux_2_35_x86_64 dist/calico-*-linux_x86_64.whl"

      - name: List built wheels
        run: |
          echo "Contents of wheelhouse directory:"
          ls -lh wheelhouse/
          echo "Contents of dist directory:"
          ls -lh dist/

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: calico-wheel-manylinux
          path: wheelhouse/*.whl
          retention-days: 30
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            dist/
            wheelhouse/
          retention-days: 7

